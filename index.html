<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Directorio de Negocios · Connecticut (Bridgeport, Stamford, Norwalk, Hartford, New Haven)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2430;
    --ink-soft:#3C4656;
    --paper:#F3EEE2;
    --paper-raised:#FBF8F0;
    --line:#D9D0B8;
    --line-strong:#B9AD8C;
    --ochre:#B4801F;
    --ochre-deep:#8C6216;
    --teal:#2C6459;
    --teal-soft:#DCE8E2;
    --rust:#9C4A2E;
    --rust-soft:#F1DDD2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering: optimizeLegibility;
  }
  .app{
    display:grid;
    grid-template-rows:auto 1fr;
    height:100vh;
    min-height:560px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 24px;
    border-bottom:1px solid var(--line-strong);
    background:var(--paper-raised);
    flex-wrap:wrap;
  }
  .brandblock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  header .tally{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    border-radius:3px;
    padding:3px 8px;
    background:var(--paper);
  }
  header .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---------- Layout ---------- */
  .main{
    display:grid;
    grid-template-columns:360px 1fr;
    height:100%;
    min-height:0;
    position:relative;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    border-right:1px solid var(--line-strong);
    background:var(--paper-raised);
    display:flex;
    flex-direction:column;
    min-height:0;
    z-index:20;
  }
  .controls{
    padding:16px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .controls input[type="text"]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    border-radius:3px;
    outline:none;
    transition:border-color .15s, background-color .15s;
  }
  .controls input[type="text"]:focus{
    border-color:var(--ink);
    background:#fff;
  }
  .controls .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .controls select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:12.5px;
    border-radius:3px;
    outline:none;
    cursor:pointer;
  }
  .controls select:focus{border-color:var(--ink);background:#fff;}
  .list-count{
    padding:8px 16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    text-transform:uppercase;
    letter-spacing:0.5px;
    background:rgba(217, 208, 184, 0.2);
  }
  .list{
    flex:1;
    overflow-y:auto;
    min-height:0;
  }
  .item{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:4px;
    font-family:inherit;
    color:inherit;
    transition:background-color .12s ease;
  }
  .item:hover{background:var(--paper);}
  .item.active{
    background:#fff;
    border-left:4px solid var(--ochre);
    padding-left:12px;
  }
  .item .iname{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    line-height:1.25;
  }
  .item .imeta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .item .idot{
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--line-strong);
    display:inline-block;
  }

  /* ---------- Map & Detail ---------- */
  .right{
    display:grid;
    grid-template-rows:1fr auto;
    min-height:0;
    position:relative;
  }
  #map{
    width:100%;
    height:100%;
    min-height:0;
    background:#e5e3df;
  }
  .detail{
    border-top:1px solid var(--line-strong);
    background:var(--paper-raised);
    padding:18px 24px;
    max-height:45vh;
    overflow-y:auto;
    z-index:25;
    box-shadow:0 -4px 16px rgba(28,36,48,0.06);
  }
  .detail.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--ink-soft);
    font-size:13px;
    background:var(--paper);
  }
  .detail-empty{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .detail-empty .arrow{font-size:18px;color:var(--ochre);}
  .detail-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .detail-header h2{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
    margin:0 0 4px 0;
    line-height:1.2;
    color:var(--ink);
  }
  .detail-type{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ochre-deep);
    text-transform:uppercase;
    letter-spacing:0.8px;
    font-weight:500;
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:3px;
    border:1.5px solid var(--teal);
    color:var(--teal);
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .stamp.corregido{border-color:var(--rust);color:var(--rust);}
  .stamp.auditado{border-color:#1A73E8;color:#1A73E8;background:#E8F0FE;}

  .detail-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px 24px;
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .field .flabel{
    font-size:10.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:3px;
  }
  .field .fvalue{font-size:13.5px;color:var(--ink);}
  .field .fvalue.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .notas{
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    border-left:2px solid var(--line-strong);
    padding-left:10px;
  }

  a.locate-link{
    font-size:12.5px;
    color:#1A73E8;
    text-decoration:none;
    font-weight:600;
  }
  a.locate-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brandblock">
      <h1>Directorio de Negocios · Connecticut</h1>
      <span class="tally" id="tally">291 registros</span>
    </div>
    <p class="subtitle">Bridgeport, Stamford, Norwalk, Danbury, Waterbury, Hartford, New Haven y más — Cobertura Oficial de Connecticut</p>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="controls">
        <input type="text" id="search" placeholder="Buscar por negocio, calle, tipo, ciudad o CP…" autocomplete="off">
        <div class="row">
          <select id="filterCategoria"><option value="">Toda categoría</option></select>
          <select id="filterCiudad"><option value="">Toda ciudad / municipio</option></select>
        </div>
      </div>
      <div class="list-count" id="listCount">Cargando negocios de Connecticut…</div>
      <div class="list" id="list"></div>
    </aside>

    <div class="right">
      <div id="map"></div>
      <div class="detail empty" id="detail">
        <div class="detail-empty">
          <span class="arrow">←</span>
          <span>Elige un negocio de la lista para ver su ficha completa y su ubicación exacta en Connecticut.</span>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="mobile-tab-bar">
  <button class="mobile-tab-btn" id="mobileTabList">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span>Lista</span>
  </button>
  <button class="mobile-tab-btn active" id="mobileTabMap">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
    <span>Mapa</span>
  </button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="zipcodes_ct.js"></script>
<script src="data_ct.js"></script>
<script src="app.js"></script>
</body>
</html>
